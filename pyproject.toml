[project]
name = "shapiq-demo"
version = "0.1.0"
description = "Pluggable Image Imputer for shapiq — experiment report"
requires-python = ">=3.12"
dependencies = [
    # Core ML
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers==4.51.3",
    "xgboost",
    # Image processing
    "opencv-python",
    "scikit-image",
    # Data
    "datasets",
    "protobuf",
    # Utilities
    "ftfy",
    "tqdm",
    "regex",
    "sentencepiece==0.2.0",
    # Visualization & notebooks
    "seaborn",
    "jupyter",
    "ipykernel",
    "ipywidgets",
    "wandb",
    # General scientific Python (transitive deps made explicit)
    "scipy",
    "numpy",
    "matplotlib",
    "pillow",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu118"]

[tool.uv.sources]
clip = { git = "https://github.com/openai/clip.git" }
